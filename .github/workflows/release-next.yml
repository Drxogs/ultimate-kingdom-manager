name: Release Next

# Test builds of the redesign. Each version gets its own release (next-vX.Y.Z), and the
# rolling "next-latest" release always carries the newest module.json, so the manifest
# link in module.json keeps finding updates.

on:
  push:
    branches:
      - redesign
    paths:
      - module.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "tag=next-v$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.check.outputs.exists == 'false'
        run: zip -r module.zip module.json LICENSE README.md scripts templates styles lang data handbook

      - name: Publish this version
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            module.json
            module.zip

      - name: Update next-latest
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view next-latest > /dev/null 2>&1; then
            gh release create next-latest --title "Next (latest test build)" --notes "Always the newest test build of the redesign." --prerelease --latest=false --target "${{ github.sha }}"
          fi
          gh release upload next-latest module.json module.zip --clobber
