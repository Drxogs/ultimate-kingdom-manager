name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          VERSION=$(jq -r .version module.json)
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "module.json version $VERSION does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Build package
        run: zip -r module.zip module.json LICENSE README.md scripts templates styles lang data

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
