name: Retag

on:
  push:
    branches:
      - main
    paths:
      - retag.txt

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move tags and rebuild release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            git push --force origin "$sha:refs/tags/$tag"
            rm -rf /tmp/src && mkdir -p /tmp/src
            git archive "$sha" | tar -x -C /tmp/src
            dirs="scripts templates styles lang data"
            [ -d /tmp/src/handbook ] && dirs="$dirs handbook"
            (cd /tmp/src && zip -qr module.zip module.json LICENSE README.md $dirs)
            gh release upload "$tag" /tmp/src/module.json /tmp/src/module.zip --clobber
            echo "done $tag"
          done < retag.txt
